// Standalone AirPlay 2 receiver (binaries taken from the spotiya AirPlay add-on).
general = {
  name = "Станция Мини";
  output_backend = "alsa";
  mdns_backend = "avahi";
  port = 7000;
};
sessioncontrol = {
  run_this_before_play_begins = "/data/opt/airplay/hooks.sh begin";
  run_this_after_play_ends = "/data/opt/airplay/hooks.sh end";
  wait_for_completion = "yes";
};
alsa = {
  output_device = "default";
  output_rate = "auto";
  output_format = "S16";
  mixer_control_name = "Master";
};
